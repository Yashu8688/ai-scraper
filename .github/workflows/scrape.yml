name: Daily Multi-Domain Job Scraper

on:
  schedule:
    # Run daily at 11:30 PM UTC = 5:00 AM IST next day
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      # No browser install: the pipeline scrapes ATS APIs only.
      run: |
        python -m pip install --upgrade pip
        pip install -r ai/requirements.txt

    - name: Run Job Aggregator
      working-directory: ai
      env:
        SMTP_HOST: smtp.gmail.com
        SMTP_PORT: "587"
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        USE_AI_FILTER: "true"
        # Required: companies are read from PostgreSQL (the dashboard writes there).
        # Without this the run silently falls back to the stale config/companies.json.
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Reports older than this are deleted before each run, which also makes those
        # companies/links eligible again.
        HISTORY_RETENTION_DAYS: "14"
        COMPANY_COOLDOWN_DAYS: "14"
      run: |
        python main.py

    - name: Commit & Push Excel History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # -A so files deleted by the retention purge are staged too, not just new reports.
        git add -A ai/data/history/
        if git diff-index --quiet HEAD --; then
          echo "No report changes today. Skipping commit."
        else
          git commit -m "chore: daily job reports $(date +'%d-%m-%Y') [skip ci]"
          # Rebase before pushing in case main moved while the scrape was running.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main (attempt $attempt)..."
            git pull --rebase origin main
          done
          echo "Could not push report history after 3 attempts."
          exit 1
        fi
